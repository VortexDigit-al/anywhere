PackageIdentifier: vortexdigital.anywhere
PackageVersion: 1.0.0
Installers:
  - Architecture: x64
    InstallerType: exe
    # Update this URL after creating the GitHub release, then recompute SHA256:
    #   (Get-FileHash dist\anywhere-installer.exe -Algorithm SHA256).Hash
    InstallerUrl: https://github.com/VortexDigit-al/anywhere/releases/download/v1.0.0/anywhere-installer.exe
    InstallerSha256: PLACEHOLDER
    InstallerSwitches:
      Silent: /S
      SilentWithProgress: /S
    # Uninstall is handled by the registry entry written during install.
    # WinGet reads UninstallString from:
    #   HKCU\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\anywhere
    UpgradeBehavior: install
    # Installs to %LOCALAPPDATA% — no UAC prompt.
    ElevationRequirement: elevationProhibited
    InstallModes:
      - interactive
      - silent
      - silentWithProgress
Dependencies:
  PackageDependencies:
    # anywhere works best when the Everything search service is running.
    # The installer will offer to install this automatically, but declaring
    # it here lets `winget install treephil11.anywhere` resolve it too.
    - PackageIdentifier: voidtools.Everything
      MinimumVersion: 1.4.0
ManifestType: installer
ManifestVersion: 1.6.0
